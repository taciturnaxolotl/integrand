<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Filled ground on purpose: an unfilled integral sign is a couple of thin
       strokes and disappears at 16px against a dark tab strip. -->
  <rect width="64" height="64" rx="14" fill="#276a80"/>
  <text x="32" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="46" fill="#fbf7ef">&#8747;</text>
</svg>
